[project]
name = "agent-harness-plugin"
version = "0.1.0"
description = "goose plugin hooks for the agent harness (stdlib-only scripts; this file configures dev tools)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["scripts", "tests"]
extraPaths = ["scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
