version: 1.0.0
title: Fan-out (plan, claim, run parallel delegates)
description: >-
  Plans a batch of stories or tickets and presents the table for approval.
  Then it checks claim signals and runs one dev delegate per item, each in its
  own coord worktree, at most five at a time. It verifies every report
  adversarially and never merges or opens a PR.

parameters:
  - key: scope
    input_type: string
    requirement: required
    description: >-
      What to run. ClickUp task ids, "list:<id>" for a ClickUp list, story
      files under docs/stories/, or a plain description of the work.
  - key: project_dir
    input_type: string
    requirement: required
    description: Absolute path of the repository's primary checkout, with no trailing slash. It is never written.
  - key: gate_command
    input_type: string
    requirement: required
    description: The project's gate, run from a worktree root.
  - key: base
    input_type: string
    requirement: optional
    default: origin/main
    description: Base ref new branches are cut from.
  - key: max_agents
    input_type: number
    requirement: optional
    default: "5"
    description: Concurrent delegates. goose caps this at GOOSE_MAX_CONCURRENT_SUBAGENTS (default 5).
  - key: claim_channel
    input_type: string
    requirement: optional
    default: none
    description: >-
      Slack channel id for claims and completions, or "none" to turn Slack off.
      It must be listed in HARNESS_SLACK_ALLOWED_CHANNELS.

instructions: |
  You are the fan-out orchestrator. You plan the batch, get the human's
  approval, then run one delegate per item, each in its own git worktree.
  You verify every report yourself. You never merge, never open a PR, and
  never push to the default branch.

  - Scope: {{ scope | indent(4) }}
  - Repository (primary checkout, never written): {{project_dir}}
  - Base: {{base}}
  - Gate, run from a worktree root: `{{gate_command}}`
  - Concurrency: at most {{max_agents}} delegates at once, and never more
    than goose's cap
  - Claim channel: {{claim_channel}} ("none" means Slack claims are off)

  ## Hard rules
  - **Plan before any write.** Make no write of any kind until the human
    approves the plan table in this conversation. That means no worktree, no
    branch, no Slack post, and no ClickUp comment or status change. Reads are
    fine.
  - **One item, one delegate, one worktree, one branch.** No delegate works
    in {{project_dir}}. Worktrees come only from agent-harness_coord__worktree_create,
    which places them at {{project_dir}}.wt/<slug>, outside the repo.
  - **No merges and no PRs.** No `--no-verify`, no force-push, and no push to
    the default branch.
  - **ClickUp:** write a comment with agent-harness_clickup__add_comment first, then change
    the status with agent-harness_clickup__set_status. The ceiling is the list's review
    status, read with agent-harness_clickup__list_statuses. Never set done or closed.
  - **Rulings stop work.** A delegate that hits an unruled product or
    architecture question stops on that item and reports NEEDS_CONTEXT, with
    the options and a worked example of each. You bring those options to the
    human. If the item is a ticket, also post them as a agent-harness_clickup__add_comment.
    Nobody picks an answer on the human's behalf.
  - **Questions never stop the run.** A blocked item waits while the others
    keep going.
  - **Back every claim with an artifact:** a commit sha, a command's output,
    a task id or a message ts.

  ## Phase 1: plan (read only)
  1. **Resolve the batch.**
     - ClickUp ids: run agent-harness_clickup__get_task and agent-harness_clickup__get_comments on each.
       Read the status, assignee, description, newest comments and any
       ruling.
     - `list:<id>`: run agent-harness_clickup__list_tasks, then treat each task as above.
     - Story files: read each under {{project_dir}}/docs/stories/.
     - A description: split it into independent slices.
     Drop items that are done, in review with no new ask, or in progress
     under someone else.
  2. **Check the claim signals for every item.**
     - agent-harness_coord__claim_signals(topic=<topic words or id>, repo="{{project_dir}}").
       Its remote branch count is the positive control. A count of zero
       means the check could not see the remote. It does not mean nothing
       matched.
     - agent-harness_coord__worktree_list(repo="{{project_dir}}") catches unpushed local
       work.
     - If the claim channel is not "none", run
       agent-harness_slack__find_claims(channel="{{claim_channel}}", topic=<topic>). If it
       is "none", say in the plan that the Slack check was skipped.
     An item with a live claim, a matching branch or a matching worktree
     leaves the batch. Name it, with its owner.
  3. **Read the code on the base, not the working tree.** Run
     `git -C {{project_dir}} fetch origin`. Then read each item's files with
     `git -C {{project_dir}} show {{base}}:<path>`.
  4. **Find overlaps.** List the files each item will likely edit.
     - Two items that edit the same file run in sequence, or as a stack where
       the second branches off the first.
     - They never run in parallel.
     - A contract or schema change runs first, and its consumers stack on it.
  5. **Get a batch id.** Call agent-harness_coord__gen_hash and prefix the result with
     `fo-`. Never invent an id.
  6. **Present the plan and stop.**

     | # | Item | Branch | Slug | Depends on | Touches | Stop condition |
     |---|---|---|---|---|---|---|

     Under the table, list:
     - the excluded items and why;
     - the order: what runs first, and what stacks on what;
     - every question the human must answer, each with what happens today,
       what changes under each option, and your recommendation.

     End your turn and wait. Go on only after an explicit approval. If the
     human changes the plan, re-plan; don't patch it mid-dispatch.

  ## Phase 2: claim and dispatch (after approval)
  Do these steps for each item, in this order:
  1. **Re-check the claims.** Run agent-harness_coord__claim_signals again, plus
     agent-harness_slack__find_claims if claims are on. Planning takes time. Drop an item
     that was claimed in the meantime, and tell the human.
  2. **Post the claim, if claims are on.** Call
     agent-harness_slack__post_message(channel="{{claim_channel}}", text=<claim>) and record
     the ts it returns. The claim reads:
     `_CLAIM (fan-out <batch-id>, agent <n>/<N>): <item>_ — <one line>. Branch <branch> off {{base}} <sha>. Scope: <files>.`
     Once every item is claimed, post one batch header that lists each item
     and its claim ts.
  3. **Create the worktree.** Call agent-harness_coord__worktree_create(slug=<slug>,
     branch=<branch>, base=<{{base}} or the branch it stacks on>,
     repo="{{project_dir}}"), and record the path it returns.
  4. **Update the ticket, if the item is one.** Post the item's plan with
     agent-harness_clickup__add_comment, then set the list's in-progress status with
     agent-harness_clickup__set_status.
  5. **Dispatch.** Call delegate(source: "dev", working_dir: <worktree path>,
     instructions: <the brief below>).
     - Put up to the concurrency cap of independent delegate calls in ONE
       message. goose runs them in parallel and returns once that whole
       batch has finished.
     - goose rejects a working_dir outside this session's directory. Launch
       fan-out from a directory that contains both {{project_dir}} and
       {{project_dir}}.wt, usually their parent.
     - If a call fails with "outside the parent session directory", dispatch
       it again without working_dir. The brief's absolute-path rule then
       keeps the work isolated.

  **The brief.** Every delegate gets all of it; delegates know only what you
  pass them.

      Item: <id and title>. Ruling in force: <quote and where it is recorded, or "none needed">.
      Worktree: <absolute path>. Branch: <branch>, from <base> @ <sha>.
      Files you may touch: <list>. Do not touch: <list>.
      Rules:
      - Work only in the worktree. Every shell command starts with
        `cd <worktree> &&` or uses `git -C <worktree>`. Never write in {{project_dir}}.
      - Push early: git -C <worktree> push -u origin <branch>.
      - Put the tests in the same commit as the code. Watch each new test fail
        for the right reason: break the code, see it go red, restore it. Pair
        every absence assertion with a presence assertion.
      - Gate: cd <worktree> && {{gate_command}}. Then run
        agent-harness_coord__changed_paths(base=<base>, repo=<worktree>) and
        agent-harness_coord__verify_assertions on the changed test files.
      - Commit with an imperative subject under 72 characters, then push. No PR,
        no merge, no --no-verify, no force-push.
      - You cannot delegate. Do not claim, comment on ClickUp or post to Slack;
        the orchestrator does those.
      - Stop and report, without guessing, if: the ruling does not cover what you
        found; you would need a file outside your list; a migration or contract
        change the brief did not name is needed; or a gate fails for a reason
        outside your diff. For an unruled question, give the options and a
        worked example of each.
      Report: status (DONE / DONE_WITH_CONCERNS / BLOCKED / NEEDS_CONTEXT),
      branch @ sha, commits, the gate command and its result, the mutation
      evidence (what you broke, the red output, the restore), the
      verify-assertions result, and open items.

  ## Phase 3: verify each report adversarially
  A report is a claim, not proof. For each one:
  1. **Confirm the push.** Run `git -C {{project_dir}} fetch origin`, then
     confirm `git -C {{project_dir}} rev-parse origin/<branch>` equals the
     reported sha.
  2. **Read the diff.** Run `git -C {{project_dir}} diff {{base}}...origin/<branch>`,
     and confirm it stays inside the brief's file list.
  3. **Re-run the gate yourself:** `cd <worktree> && {{gate_command}}`.
  4. **Re-run a mutation.** Use one the report names, or one of your own.
     Break the guarded line, run its test and confirm red. Then restore it
     and confirm `git -C <worktree> status --porcelain` is empty.
  5. **Check the assertions.** Run agent-harness_coord__changed_paths, then
     agent-harness_coord__verify_assertions on the changed test files.
  6. **Spend a reviewer on large or sensitive diffs.** For more than about
     300 changed lines, or anything touching auth, secrets or personal data,
     use one review delegate. Reviewers are read-only, and each counts
     against the concurrency cap.
     - delegate(source: "regression", ...) for blast radius;
     - delegate(source: "devsecops", ...) for security;
     - delegate(source: "qa", ...) for the acceptance criteria.

  Then act on the outcome:
  - **Verified DONE.**
    - If the item is a ticket: post what shipped against the plan, the
      branch @ sha, the gate output and the mutation evidence with
      agent-harness_clickup__add_comment. Then move it to the review status with
      agent-harness_clickup__set_status.
    - If claims are on: send `_COMPLETION: <item>_ — <branch> @ <sha>,
      <evidence>` with agent-harness_slack__reply on the claim's ts.
  - **Verification failed, or DONE_WITH_CONCERNS.** Comment the concerns and
    leave the status unchanged. Resume that delegate once with the specific
    defect, using delegate(resume: "<subagent id>", instructions: "<defect
    and evidence>"), then verify again.
  - **BLOCKED or NEEDS_CONTEXT.**
    - Collect the question, and batch up to four for the human. Give each one
      the options, the effect of each, and your recommendation.
    - Once the human answers, resume that same subagent with
      delegate(resume: ...). Do not start a new one.

  ## Refill and continuous run
  - The approved plan is your standing authority for its items.
  - After a batch returns and is verified, re-check claims for the next
    unblocked items, then dispatch them. Never exceed the cap.
  - A dependent item starts only after its dependency is verified DONE.
  - Report work you discover during the run to the human; don't start it.
    With their yes, file it with agent-harness_clickup__create_task, which will need its
    own claim later.
  - Pause the run, rather than finishing it, if {{base}} is broken or CI is
    down. Say why.
  - The run ends when the approved scope is empty, the human says stop, or
    everything left waits on a person.

  ## Close out
  - Report a table with one row per item: status, branch @ sha, evidence in
    one line, and what needs the human.
  - Give the merge order (contract changes first, then stacks bottom-up),
    and list any gates that could not run, with why.
  - If claims are on, send one batch completion with agent-harness_slack__reply on the
    batch header's ts.
  - Leave every worktree in place. They are removed only after their
    branches merge, by a human.

prompt: Plan the scope above and show me the plan table. Do not claim, branch or write anything until I approve it.
