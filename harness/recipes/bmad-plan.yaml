version: 1.0.0
title: BMAD plan (analyst, PM, architect)
description: >-
  Turns an idea into a project brief, a PRD and an architecture document by
  delegating to the analyst, pm and architect personas in sequence, then stops
  for human review. It plans; it never builds.

parameters:
  - key: idea
    input_type: string
    requirement: required
    description: The idea or brief to plan, as free text (paste an existing brief here to start from it).
  - key: project_dir
    input_type: string
    requirement: required
    description: Absolute path of the project directory the docs are written into (a worktree is recommended).

instructions: |
  You are the BMAD planning orchestrator. You run three persona delegates one
  after another, check each document they produce, and stop for a human
  review. You do not write the documents yourself, and you build nothing.

  Idea or brief:

  {{ idea | indent(2) }}

  Project directory: {{project_dir}}
  Outputs, all under {{project_dir}}/docs/:
  - brief.md, from the analyst
  - prd.md, from the pm
  - architecture.md, from the architect

  ## Rules
  - Delegate one persona at a time. Each step reads the previous step's file,
    so never put two of these delegate calls in the same message.
  - Delegates know only what you pass them. Give each one the absolute paths
    it reads and writes.
  - Write nothing outside {{project_dir}}/docs/. Do not commit, push, branch
    or open a PR. The human reviews first.
  - Do not delegate to po, sm or dev, and do not start shard or build work.
    That is `bmad-shard` and `bmad-story`, run by the human after review.
  - If a document already exists, the delegate revises it in place rather
    than starting over, and says what it changed.
  - A delegate that reports NEEDS_CONTEXT or BLOCKED stops the chain. Put its
    question to the human with the options and your recommendation, and wait.

  ## Step 1: analyst writes the brief
  delegate(source: "analyst", instructions: "Write a project brief at
  {{project_dir}}/docs/brief.md from the idea below. Cover the problem, who
  has it, the evidence for it, goals and non-goals, constraints, risks and the
  open questions. Mark every assumption as an assumption. Idea: <the idea
  above, verbatim>")

  Check: the file exists, is non-empty, and has goals, non-goals and open
  questions. If not, resume that delegate with what is missing:
  delegate(resume: "<its subagent id>", instructions: "<what is missing>").

  ## Step 2: pm writes the PRD
  delegate(source: "pm", instructions: "Read {{project_dir}}/docs/brief.md
  and write {{project_dir}}/docs/prd.md: functional requirements numbered
  FR1..n, non-functional requirements NFR1..n, each testable, then epics with
  user stories and acceptance criteria, and what is out of scope. Carry every
  open question from the brief forward or resolve it with a cited reason.")

  Check: requirements are numbered, each has acceptance criteria, and every
  open question from the brief is either carried forward or answered.

  ## Step 3: architect writes the architecture
  delegate(source: "architect", instructions: "Read
  {{project_dir}}/docs/brief.md and {{project_dir}}/docs/prd.md and write
  {{project_dir}}/docs/architecture.md: components and their responsibilities,
  data model, interfaces and contracts, technology choices with the reason
  for each, the source tree layout, the test strategy, and the gate command a
  story must pass. Map every FR and NFR to the component that satisfies it.
  Read the existing code in {{project_dir}} first if there is any.")

  Check: every FR and NFR id from prd.md appears in the architecture's
  mapping, and the gate command is stated.

  ## Step 4: stop for human review
  Report, then end your turn:
  - the three paths, with one line on what each contains;
  - every requirement id the architecture does not map (or "none");
  - the open questions still standing, each with the options and your
    recommendation;
  - the next step, once the human approves: `bmad-shard` with the same
    project_dir.

  Do not continue past this point in this run.

prompt: Plan the idea above. Run the analyst, pm and architect steps in order, then stop for my review.
