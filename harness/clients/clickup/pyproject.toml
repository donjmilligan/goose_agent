[project]
name = "harness-clickup"
version = "0.1.0"
description = "ClickUp REST v2 client and stdio MCP server for the goose agent harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "mcp>=1.9,<2",
    "python-dotenv>=1.0",
]

[project.scripts]
harness-clickup-mcp = "harness_clickup.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_clickup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
